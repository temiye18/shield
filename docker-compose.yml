version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: shield_db
    environment:
      POSTGRES_USER: shield
      POSTGRES_PASSWORD: shield_dev_password
      POSTGRES_DB: shield_db
    ports:
      - "5432:5432"
    volumes:
      - shield_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shield -d shield_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: shield_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://shield:shield_dev_password@db:5432/shield_db
      SECRET_KEY: dev-secret-key-not-for-production
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  shield_pgdata:
